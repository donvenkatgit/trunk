server.port=8081
spring.application.name=examplemcpserver

spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Basic metadata shared with the client during initialization
spring.ai.mcp.server.name=myremotemcpserver1
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.enabled=true
spring.ai.mcp.server.instructions=This server handles custom external operations.
spring.ai.mcp.server.description=Example MCP Server with Books Management
# Turn off the default local standard input/output transport
spring.ai.mcp.server.stdio=false
# Enable network transport (STREAMABLE is recommended over deprecated SSE)
spring.ai.mcp.server.protocol=STREAMABLE

# Optional: Customize the endpoint path (Defaults to /mcp if omitted)
spring.ai.mcp.server.streamable.path=/mcp
# spring.ai.mcp.server.sseEndpoint=/mcp/sse
# spring.ai.mcp.server.sseMessageEndpoint=/mcp/sse/message
spring.ai.mcp.server.annotation-scanner=enabled=true
spring.ai.mcp.server.resourceChangeNotification=true
spring.ai.mcp.server.toolChangeNotification=true
spring.ai.mcp.server.promptChangeNotification=true
spring.ai.mcp.server.resetTimeoutOnProgress=true
spring.ai.mcp.server.request-timeout=600s
spring.ai.mcp.server.type=sync
spring.ai.mcp.server.capabilities.completion=true
spring.ai.mcp.server.capabilities.prompt=true
spring.ai.mcp.server.capabilities.tool=true
spring.ai.mcp.server.capabilities.resource=true



logging.level.io.modelcontextprotocol=DEBUG
logging.level.org.springframework.ai.mcp=DEBUG
